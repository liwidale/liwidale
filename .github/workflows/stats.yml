name: stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/stats.yml]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Render cards
        run: node scripts/stats.mjs
        env:
          # Optional STATS_TOKEN (classic PAT, read:user) also counts private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit changes
        run: |
          git config user.name "Liwidale"
          git config user.email "299171130+liwidale@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "{ゝ} Updated stats"
          git push
