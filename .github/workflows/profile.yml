name: profile

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["README.md", ".github/scripts/**", ".github/assets/**", ".github/workflows/profile.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Render cards
        run: node .github/scripts/render.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Refresh image cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          gh api "repos/${{ github.repository }}/readme" -H "Accept: application/vnd.github.html" \
            | grep -o 'https://camo.githubusercontent.com/[^"]*' | sort -u \
            | xargs -r -n1 curl -s -o /dev/null -X PURGE
