<svg xmlns="http://www.w3.org/2000/svg" width="612" height="96" viewBox="0 0 612 96" role="img" aria-label="matrix @liwidale:matrix.org">
<title>matrix @liwidale:matrix.org</title>
<style>@font-face{font-family:'Inter';font-weight:300;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Geist Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.l{font-family:'Geist Mono', 'Noto Sans JP', ui-monospace, Menlo, Consolas, monospace;font-size:15px;letter-spacing:1.5px;fill:#8F8F8F}
.v{font-family:'Geist Mono', 'Noto Sans JP', ui-monospace, Menlo, Consolas, monospace;font-size:17px;letter-spacing:0.5px;fill:#FFFFFF}
.t{font-family:'Inter', 'Noto Sans JP', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:300;fill:#FFFFFF}
.r{font-family:'Inter', 'Noto Sans JP', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400;fill:#8F8F8F}
.m{font-family:'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;font-size:17px;fill:#A87854}
.a{fill:#A87854}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes drift{to{transform:scale(1.03)}}
.in{animation:fade .3s cubic-bezier(.16,1,.3,1) both}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow .6s cubic-bezier(.16,1,.3,1) both}
.drift{transform-box:fill-box;transform-origin:50% 50%;animation:drift 30s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(6 0)">
<defs><clipPath id="clip"><rect width="600" height="96" rx="16"/></clipPath><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feComponentTransfer in="b" result="s"><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="600" height="96" rx="16" fill="#000000"/>

<text class="l" x="40" y="56">MATRIX</text>
<text class="t" x="200" y="57" font-size="22" letter-spacing="-0.3">@liwidale:matrix.org</text>
<text class="r" x="560" y="57" font-size="20" text-anchor="end">↗</text>
<rect x=".5" y=".5" width="599" height="95" rx="15.5" fill="none" stroke="#222222"/>
</g>
</svg>
