<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Weekly rhythm. Busiest day SUN, quietest THU, 40% on weekdays.">
<title>Weekly rhythm. Busiest day SUN, quietest THU, 40% on weekdays.</title>
<style>@font-face{font-family:'Inter';font-weight:300;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Geist Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.l{font-family:'Geist Mono', 'Noto Sans JP', ui-monospace, Menlo, Consolas, monospace;font-size:15px;letter-spacing:1.5px;fill:#8F8F8F}
.v{font-family:'Geist Mono', 'Noto Sans JP', ui-monospace, Menlo, Consolas, monospace;font-size:17px;letter-spacing:0.5px;fill:#FFFFFF}
.t{font-family:'Inter', 'Noto Sans JP', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:300;fill:#FFFFFF}
.r{font-family:'Inter', 'Noto Sans JP', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400;fill:#8F8F8F}
.m{font-family:'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;font-size:17px;fill:#A87854}
.a{fill:#A87854}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes drift{to{transform:scale(1.03)}}
.in{animation:fade .3s cubic-bezier(.16,1,.3,1) both}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow .6s cubic-bezier(.16,1,.3,1) both}
.drift{transform-box:fill-box;transform-origin:50% 50%;animation:drift 30s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="clip"><rect width="600" height="320" rx="16"/></clipPath><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feComponentTransfer in="b" result="s"><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="600" height="320" rx="16" fill="#000000"/>

<text class="l" x="40" y="58">WEEKLY RHYTHM</text>
<rect class="rise" style="animation-delay:0ms" x="40" y="171.83333333333331" width="8" height="64.16666666666667" rx="4" fill="#363636"/>
<text class="l" x="44" y="276" text-anchor="middle">M</text>
<rect class="rise" style="animation-delay:30ms" x="80" y="218.5" width="8" height="17.5" rx="4" fill="#363636"/>
<text class="l" x="84" y="276" text-anchor="middle">T</text>
<rect class="rise" style="animation-delay:60ms" x="120" y="189.33333333333334" width="8" height="46.666666666666664" rx="4" fill="#363636"/>
<text class="l" x="124" y="276" text-anchor="middle">W</text>
<rect class="rise" style="animation-delay:90ms" x="160" y="230.16666666666666" width="8" height="5.833333333333333" rx="4" fill="#363636"/>
<text class="l" x="164" y="276" text-anchor="middle">T</text>
<rect class="rise" style="animation-delay:120ms" x="200" y="218.5" width="8" height="17.5" rx="4" fill="#363636"/>
<text class="l" x="204" y="276" text-anchor="middle">F</text>
<rect class="rise" style="animation-delay:150ms" x="240" y="148.5" width="8" height="87.5" rx="4" fill="#363636"/>
<text class="l" x="244" y="276" text-anchor="middle">S</text>
<rect class="rise" style="animation-delay:180ms" x="280" y="96" width="8" height="140" rx="4" fill="#A87854" filter="url(#glow)"/>
<text class="l" x="284" y="276" text-anchor="middle" style="fill:#FFFFFF">S</text>
<text class="l" x="360" y="140">BUSIEST</text><text class="t" x="560" y="140" font-size="26" text-anchor="end" letter-spacing="-0.5">Sun</text>
<line x1="360" x2="560" y1="164" y2="164" stroke="#1A1A1A"/>
<text class="l" x="360" y="204">QUIETEST</text><text class="t" x="560" y="204" font-size="26" text-anchor="end" letter-spacing="-0.5">Thu</text>
<line x1="360" x2="560" y1="228" y2="228" stroke="#1A1A1A"/>
<text class="l" x="360" y="268">WEEKDAYS</text><text class="t" x="560" y="268" font-size="26" text-anchor="end" letter-spacing="-0.5">40%</text>
<rect x=".5" y=".5" width="599" height="319" rx="15.5" fill="none" stroke="#222222"/>
</svg>
